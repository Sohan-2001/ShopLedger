<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI sends order requests through Express routes to pricing, coupon, tax, inventory, ledger, and order modules, then persists the order in db.json. Invoice and tax modules are highlighted for Ticket 1.</desc>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.route{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.lib{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:3}.config{fill:#fef3c7;stroke:#d97706;stroke-width:2}.data{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.title{font:700 20px Arial,sans-serif;fill:#0f172a}.label{font:700 15px Arial,sans-serif;fill:#0f172a}.text{font:13px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#475569}.step{fill:#0f766e}.steptext{font:700 13px Arial,sans-serif;fill:#fff}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="800" rx="16"/>
  <text x="48" y="48" class="title">ShopLedger — order placement architecture</text>
  <text x="48" y="72" class="text">Numbered arrows show the successful POST /api/orders path.</text>

  <rect class="box" x="48" y="125" width="210" height="115" rx="10"/><text x="70" y="157" class="label">Browser UI</text><text x="70" y="181" class="text">public/index.html</text><text x="70" y="202" class="text">public/js/app.js + css</text><text x="70" y="223" class="small">POS, preview, orders, audit</text>
  <rect class="box" x="340" y="125" width="210" height="115" rx="10"/><text x="362" y="157" class="label">server.js</text><text x="362" y="181" class="text">Express + JSON middleware</text><text x="362" y="202" class="text">static public/ + route mount</text><text x="362" y="223" class="small">GET /orders/:id/invoice</text>
  <rect class="route" x="632" y="105" width="240" height="155" rx="10"/><text x="654" y="137" class="label">routes/</text><text x="654" y="162" class="text">orders.js: POST /orders</text><text x="654" y="184" class="text">products.js, customers.js</text><text x="654" y="206" class="text">reports.js: pricing preview</text><text x="654" y="230" class="small">validates request and orchestrates</text>
  <rect class="config" x="958" y="125" width="190" height="115" rx="10"/><text x="980" y="157" class="label">config.js</text><text x="980" y="181" class="text">shop, HSN slabs</text><text x="980" y="202" class="text">coupons, port</text>

  <rect class="lib" x="72" y="360" width="185" height="138" rx="10"/><text x="94" y="392" class="label">lib/pricing.js</text><text x="94" y="416" class="text">subtotal + totals</text><text x="94" y="438" class="text">apportions discount</text><text x="94" y="460" class="text">tax after discount</text>
  <rect class="lib" x="295" y="360" width="185" height="138" rx="10"/><text x="317" y="392" class="label">lib/coupons.js</text><text x="317" y="416" class="text">normalizes, validates</text><text x="317" y="438" class="text">caps discounts</text>
  <rect class="ticket" x="518" y="340" width="190" height="178" rx="10"/><text x="540" y="372" class="label">lib/tax.js</text><text x="540" y="396" class="text">HSN slab resolution</text><text x="540" y="418" class="text">CGST/SGST split</text><rect x="540" y="449" width="145" height="40" rx="6" fill="#fff" stroke="#e11d48"/><text x="552" y="474" class="label">Ticket 1 module</text>
  <rect class="lib" x="746" y="360" width="185" height="138" rx="10"/><text x="768" y="392" class="label">lib/inventory.js</text><text x="768" y="416" class="text">find, check, reserve</text><text x="768" y="438" class="text">stock validation</text>
  <rect class="lib" x="969" y="360" width="170" height="138" rx="10"/><text x="991" y="392" class="label">lib/ledger.js</text><text x="991" y="416" class="text">Khata debit</text><text x="991" y="438" class="text">credit-limit check</text>
  <rect class="ticket" x="375" y="585" width="220" height="112" rx="10"/><text x="397" y="617" class="label">lib/invoice.js</text><text x="397" y="641" class="text">invoice figures + HTML</text><text x="397" y="670" class="label">Ticket 1 module</text>
  <rect class="lib" x="650" y="585" width="180" height="112" rx="10"/><text x="672" y="617" class="label">lib/orders.js</text><text x="672" y="641" class="text">adds saved order</text><text x="672" y="663" class="text">query + cancel</text>
  <rect class="data" x="900" y="585" width="210" height="112" rx="10"/><text x="922" y="617" class="label">data/db.json</text><text x="922" y="641" class="text">products, orders, customers</text><text x="922" y="663" class="text">audit log + counters</text>

  <path class="arrow" d="M258 182H340"/><circle class="step" cx="300" cy="166" r="13"/><text x="296" y="171" class="steptext">1</text>
  <path class="arrow" d="M550 182H632"/><circle class="step" cx="590" cy="166" r="13"/><text x="586" y="171" class="steptext">2</text>
  <path class="arrow" d="M752 260V320H164V360"/><circle class="step" cx="465" cy="305" r="13"/><text x="461" y="310" class="steptext">3</text>
  <path class="arrow" d="M257 429H295"/><path class="arrow" d="M480 429H518"/><circle class="step" cx="498" cy="413" r="13"/><text x="494" y="418" class="steptext">4</text>
  <path class="arrow" d="M872 260V320H838V360"/><path class="arrow" d="M872 260V320H1054V360"/><circle class="step" cx="888" cy="304" r="13"/><text x="884" y="309" class="steptext">5</text>
  <path class="arrow" d="M838 498V550H740V585"/><circle class="step" cx="789" cy="548" r="13"/><text x="785" y="553" class="steptext">6</text>
  <path class="arrow" d="M830 641H900"/><circle class="step" cx="865" cy="625" r="13"/><text x="861" y="630" class="steptext">7</text>
  <path class="arrow" d="M1053 240V300H613V340"/><path class="arrow" d="M1053 240V565H485V585"/>
  <rect x="48" y="740" width="18" height="18" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="76" y="754" class="text">Accent: Ticket 1 invoice/GST modules</text><text x="450" y="754" class="small">Invoice rendering reads the saved order; it does not write db.json.</text>
</svg>
